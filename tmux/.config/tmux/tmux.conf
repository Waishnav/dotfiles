# set-window-option -q -g utf8 on

setw -g mouse on
set -s escape-time 0
set -s extended-keys on

# set -ga terminal-overrides ",screen-256color*:Tc"
# set-option -g default-terminal "screen-256color"
# Use proper terminfo inside tmux
set -g default-terminal "tmux-256color"

# Enable truecolor passthrough (newer tmux prefers terminal-features)
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-features ',tmux-256color:RGB'

# Legacy fallback for older tmux: advertise Tc (truecolor) to everyone
set -ga terminal-overrides ",*:Tc"
set -g history-limit 5000

unbind C-b
set-option -g prefix M-a
bind-key M-a send-prefix

set -g status-style 'bg=#333333 fg=#5eacd3'
set-option -g status-position top

bind r source-file ~/.config/tmux/tmux.conf
set -g base-index 1

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
# bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.dotfiles/personal/todo.md"
bind-key -r n new-window

# forget the find window.  That is for chumps
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
# default session with hotkeys
bind-key -r S run-shell "~/.local/bin/tmux-sessionizer ~/sandbox"
