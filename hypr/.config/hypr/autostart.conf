# Extra autostart processes
exec-once = uwsm app -- hyprsunset

# Use swaync instead of mako for notification action buttons support
exec-once = pkill -x mako
exec-once = uwsm-app -- swaync

# mconnect - KDE Connect protocol implementation for phone integration
exec-once = mconnect

# Monitor event listener (handles window migration on external monitor disconnect)
exec-once = ~/.local/bin/hypr-event-listener

# Touchpad gestures for workspace switching
exec-once = libinput-gestures-setup start

# Clipboard history daemon (requires cliphist: sudo pacman -S cliphist)
exec-once = wl-paste --watch cliphist store

exec-once = ~/.local/bin/watch-system-theme

# Tmux sidebar: launched on demand via Alt+S (tmux-sidebar-toggle)
# exec-once = sleep 2 && alacritty --class sidebar-tui -e ~/.local/bin/tmux-sidebar
# exec-once = sleep 3 && ~/.local/bin/tmux-sidebar-daemon
