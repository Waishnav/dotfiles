# Application bindings
unbind = SUPER, V
bindd = SUPER, V, Clipboard, exec, ~/.local/bin/waybar-clipboard

bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = ALT, T, Alacritty, exec, uwsm-app -- alacritty
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = ALT, E, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = ALT, B, Brave browser, exec, uwsm-app -- brave
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# ── Screenshot bindings (swapped from defaults) ──
# Print: direct to clipboard
# Shift+Print: open image editor
unbind = , PRINT
unbind = SHIFT, PRINT
bindd = , PRINT, Screenshot to clipboard, exec, omarchy-cmd-screenshot smart clipboard
bindd = SHIFT, PRINT, Screenshot with editing, exec, omarchy-cmd-screenshot

# Zoom toggle (hyprzoom)
bind = SUPER, Z, exec, ~/.local/bin/hyprzoom-toggle
bind = SUPER, X, exec, ~/.cargo/bin/hyprzoom zoom 1.0

# ── Window Groups (Tabbed/Stacked) ──
# Toggle group: groups current window with adjacent window (like browser tabs)
bindd = SUPER SHIFT, G, Toggle window grouping, togglegroup
bindd = SUPER ALT, G, Move window out of group, moveoutofgroup

# Move window into group in direction
bindd = SUPER ALT, LEFT, Move window to group on left, moveintogroup, l
bindd = SUPER ALT, RIGHT, Move window to group on right, moveintogroup, r
bindd = SUPER ALT, UP, Move window to group on top, moveintogroup, u
bindd = SUPER ALT, DOWN, Move window to group on bottom, moveintogroup, d

# Navigate within a group (switch tabs)
bindd = SUPER ALT, TAB, Next window in group, changegroupactive, f
bindd = SUPER ALT SHIFT, TAB, Previous window in group, changegroupactive, b
bindd = SUPER CTRL, LEFT, Previous group window, changegroupactive, b
bindd = SUPER CTRL, RIGHT, Next group window, changegroupactive, f

# Scroll through grouped windows
bindd = SUPER ALT, mouse_down, Next window in group, changegroupactive, f
bindd = SUPER ALT, mouse_up, Previous window in group, changegroupactive, b

# Jump to specific window in group by number (1-5)
unbind = ALT, code:10
unbind = ALT, code:11
unbind = ALT, code:12
unbind = ALT, code:13
unbind = ALT, code:14
bind = ALT, 1, exec, ~/.local/bin/switch-group-window 1
bind = ALT, 2, exec, ~/.local/bin/switch-group-window 2
bind = ALT, 3, exec, ~/.local/bin/switch-group-window 3
bind = ALT, 4, exec, ~/.local/bin/switch-group-window 4
bind = ALT, 5, exec, ~/.local/bin/switch-group-window 5

# ── Synchronized Workspaces (KDE-style) ──
# Both monitors switch together: Super+N switches laptop to WS N, external to WS 1N
# Laptop-only mode: just switches WS 1-4 normally (WS 11-14 are unused/ignored)
#
# Unbind all default workspace switching & moving (SUPER+1 through SUPER+0)
unbind = SUPER, code:10
unbind = SUPER, code:11
unbind = SUPER, code:12
unbind = SUPER, code:13
unbind = SUPER, code:14
unbind = SUPER, code:15
unbind = SUPER, code:16
unbind = SUPER, code:17
unbind = SUPER, code:18
unbind = SUPER, code:19
unbind = SUPER SHIFT, code:10
unbind = SUPER SHIFT, code:11
unbind = SUPER SHIFT, code:12
unbind = SUPER SHIFT, code:13
unbind = SUPER SHIFT, code:14
unbind = SUPER SHIFT, code:15
unbind = SUPER SHIFT, code:16
unbind = SUPER SHIFT, code:17
unbind = SUPER SHIFT, code:18
unbind = SUPER SHIFT, code:19

# Switch workspace pairs: laptop(1-8) + external(11-18)
# Workspace mapping (6 workspaces total):
# Super+1-3 → WS 1-3
# Super+8-0 → WS 4-6
bindd = SUPER, code:10, Switch to workspace 1, exec, ~/.local/bin/hypr-switch-workspace 1
bindd = SUPER, code:11, Switch to workspace 2, exec, ~/.local/bin/hypr-switch-workspace 2
bindd = SUPER, code:12, Switch to workspace 3, exec, ~/.local/bin/hypr-switch-workspace 3
bindd = SUPER, code:17, Switch to workspace 4, exec, ~/.local/bin/hypr-switch-workspace 4
bindd = SUPER, code:18, Switch to workspace 5, exec, ~/.local/bin/hypr-switch-workspace 5
bindd = SUPER, code:19, Switch to workspace 6, exec, ~/.local/bin/hypr-switch-workspace 6

# Move window to workspace on current monitor (context-aware)
# If on laptop: moves to WS 1-8. If on external: moves to WS 11-18.
bindd = SUPER SHIFT, code:10, Move window to workspace 1, exec, ~/.local/bin/hypr-move-to-workspace 1
bindd = SUPER SHIFT, code:11, Move window to workspace 2, exec, ~/.local/bin/hypr-move-to-workspace 2
bindd = SUPER SHIFT, code:12, Move window to workspace 3, exec, ~/.local/bin/hypr-move-to-workspace 3
bindd = SUPER SHIFT, code:17, Move window to workspace 4, exec, ~/.local/bin/hypr-move-to-workspace 4
bindd = SUPER SHIFT, code:18, Move window to workspace 5, exec, ~/.local/bin/hypr-move-to-workspace 5
bindd = SUPER SHIFT, code:19, Move window to workspace 6, exec, ~/.local/bin/hypr-move-to-workspace 6
