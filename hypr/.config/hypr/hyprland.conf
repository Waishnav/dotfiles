# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# ── Cursor settings ──
cursor {
    no_warps = true  # Prevent cursor from jumping when focusing windows (e.g., Outloud)
    inactive_timeout = 0  # Never hide cursor automatically
}

# Use defaults Omarchy defaults (but don't edit these directly!)
source = ~/.local/share/omarchy/default/hypr/autostart.conf
source = ~/.local/share/omarchy/default/hypr/bindings/media.conf
source = ~/.local/share/omarchy/default/hypr/bindings/clipboard.conf
source = ~/.config/hypr/omarchy-compat/bindings/tiling-v2.conf
source = ~/.local/share/omarchy/default/hypr/bindings/utilities.conf
source = ~/.local/share/omarchy/default/hypr/envs.conf
source = ~/.config/hypr/omarchy-compat/looknfeel.conf
source = ~/.local/share/omarchy/default/hypr/input.conf
source = ~/.local/share/omarchy/default/hypr/windows.conf
source = ~/.config/omarchy/current/theme/hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Add any other personal Hyprland configuration below
# windowrule = workspace 5, match:class qemu

# ── Nautilus (File Manager) ──
windowrule = float on, match:class org.gnome.Nautilus
windowrule = size 1200 800, match:class org.gnome.Nautilus

# ── Tmux sidebar ──
# Regular tiled window, no border
windowrule = border_size 0, match:class sidebar-tui

# Alt+S: launch or focus tmux sidebar
# bindd = ALT, S, Focus tmux sidebar, exec, ~/.local/bin/tmux-sidebar-toggle

# ── Outloud voice recorder overlay ──
# Float, position center-bottom, no border, always on top
windowrule = float on, match:class brave-biodaehjoiloffjkhkpbikhlahokngpk.*Default
windowrule = size 150 54, match:class brave-biodaehjoiloffjkhkpbikhlahokngpk.*Default
windowrule = move (monitor_w/2-75) (monitor_h-74), match:class brave-biodaehjoiloffjkhkpbikhlahokngpk.*Default
windowrule = border_size 0, match:class brave-biodaehjoiloffjkhkpbikhlahokngpk.*Default

# Alt+R: toggle Outloud window (bring to current workspace or hide)
bindd = ALT, R, Toggle Outloud recorder, exec, ~/.local/bin/toggle-outloud

# ── Synchronized workspace pairs (KDE-style) ──
# Laptop: WS 1-6, External: WS 11-16
# Pairs: 1+11, 2+12, 3+13, 4+14, 5+15, 6+16
workspace = 1, monitor:eDP-1, default:true, persistent:true
workspace = 2, monitor:eDP-1, persistent:true
workspace = 3, monitor:eDP-1, persistent:true
workspace = 4, monitor:eDP-1, persistent:true
workspace = 5, monitor:eDP-1, persistent:true
workspace = 6, monitor:eDP-1, persistent:true

workspace = 11, monitor:HDMI-A-1, default:true, persistent:true
workspace = 12, monitor:HDMI-A-1, persistent:true
workspace = 13, monitor:HDMI-A-1, persistent:true
workspace = 14, monitor:HDMI-A-1, persistent:true
workspace = 15, monitor:HDMI-A-1, persistent:true
workspace = 16, monitor:HDMI-A-1, persistent:true
